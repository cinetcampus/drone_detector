<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raspi recorder</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --primary: #e94560;
      --primary-hover: #c73650;
      --accent: #0f3460;
      --text: #eee;
      --text-muted: #999;
      --success: #2ecc71;
      --danger: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    h1 span { color: var(--primary); }

    /* ── Record panel ──────────────────────────── */
    .record-panel {
      background: var(--surface);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      margin-bottom: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
    }

    .record-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid var(--primary);
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: all .2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .record-btn:hover { background: rgba(233,69,96,.15); }

    .record-btn .icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 50%;
      transition: all .2s;
    }

    .record-btn.recording .icon {
      border-radius: 6px;
      width: 30px;
      height: 30px;
    }

    .record-btn.recording {
      border-color: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(233,69,96,.4); }
      50% { box-shadow: 0 0 0 15px rgba(233,69,96,0); }
    }

    .timer {
      font-size: 2rem;
      font-variant-numeric: tabular-nums;
      margin-top: 1rem;
      color: var(--text-muted);
    }

    .timer.active { color: var(--primary); }

    .status-text {
      margin-top: .5rem;
      font-size: .9rem;
      color: var(--text-muted);
    }

    /* ── Recordings list ───────────────────────── */
    .recordings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .5rem;
    }

    .recordings-header h2 { font-size: 1.2rem; }

    .recording-count {
      font-size: .85rem;
      color: var(--text-muted);
    }

    .bulk-bar {
      display: none;
      align-items: center;
      gap: .6rem;
      padding: .5rem .8rem;
      background: var(--accent);
      border-radius: 10px;
      margin-bottom: .75rem;
    }

    .bulk-bar.visible { display: flex; }

    .bulk-bar-count {
      flex: 1;
      font-size: .85rem;
      color: var(--text-muted);
    }

    .bulk-btn {
      border: none;
      border-radius: 8px;
      padding: .4rem .9rem;
      cursor: pointer;
      font-size: .85rem;
      background: var(--primary);
      color: #fff;
      transition: background .15s;
    }

    .bulk-btn:hover { background: var(--primary-hover); }

    .bulk-btn.secondary {
      background: rgba(255,255,255,.1);
      color: var(--text);
    }

    .bulk-btn.secondary:hover { background: rgba(255,255,255,.2); }

    .bulk-btn.danger {
      background: rgba(231,76,60,.25);
      color: #ffb2a9;
    }

    .bulk-btn.danger:hover { background: var(--danger); color: #fff; }

    .rec-check {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .recording-item.selected {
      outline: 2px solid var(--primary);
    }

    .recordings-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .recording-item {
      background: var(--surface);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      transition: transform .15s;
    }

    .recording-item:hover { transform: translateY(-1px); }

    .recording-info {
      flex: 1;
      min-width: 0;
    }

    .recording-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: .95rem;
    }

    .recording-meta {
      font-size: .8rem;
      color: var(--text-muted);
      margin-top: .2rem;
    }

    .recording-actions {
      display: flex;
      gap: .4rem;
      flex-shrink: 0;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: background .15s;
    }

    .btn-icon:hover { background: #1a4a8a; }
    .btn-icon.danger:hover { background: var(--danger); }

    /* ── Audio player ──────────────────────────── */
    .player-bar {
      background: var(--surface);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      display: none;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }

    .player-bar.visible { display: flex; }

    .player-bar .now-playing {
      flex: 1;
      min-width: 0;
      font-size: .9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-bar audio {
      flex: 2;
      min-width: 0;
      height: 36px;
    }

    .player-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* ── Rename modal ──────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.visible { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.5rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }

    .modal h3 { margin-bottom: 1rem; }

    .modal input[type="text"] {
      width: 100%;
      padding: .6rem .8rem;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .modal-buttons {
      display: flex;
      gap: .5rem;
      justify-content: flex-end;
    }

    .modal-buttons button {
      padding: .5rem 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: .9rem;
    }

    .btn-cancel { background: var(--accent); color: var(--text); }
    .btn-save { background: var(--primary); color: #fff; }
    .btn-save:hover { background: var(--primary-hover); }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: .3;
    }

    /* ── Light theme ───────────────────────────── */
    body.light {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --primary: #e94560;
      --primary-hover: #c73650;
      --accent: #c8d6e5;
      --text: #1a1a2e;
      --text-muted: #555;
      --success: #27ae60;
      --danger: #e74c3c;
    }

    body.light .btn-icon:hover { background: #a8bcd4; }

    /* ── Settings bar ──────────────────────────── */
    .settings-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1rem;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-size: .82rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--accent);
      border-radius: 20px;
      transition: background .2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .2s;
    }

    .toggle-switch input:checked + .toggle-slider { background: var(--primary); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); }
  </style>
</head>
<body>

<div class="container">
  <h1>🎙️ <span data-i18n="appName">Raspi recorder</span></h1>

  <!-- Settings bar -->
  <div class="settings-bar">
    <label class="toggle-label">
      <span id="themeLabel">Light mode</span>
      <span class="toggle-switch">
        <input type="checkbox" id="themeToggle">
        <span class="toggle-slider"></span>
      </span>
    </label>
    <label class="toggle-label">
      <span id="autoPlayLabel">Auto-play</span>
      <span class="toggle-switch">
        <input type="checkbox" id="autoPlayToggle">
        <span class="toggle-slider"></span>
      </span>
    </label>
  </div>

  <!-- Record panel -->
  <div class="record-panel">
    <button class="record-btn" id="recordBtn" data-i18n-title="recordButtonTitle" title="Aloita/lopeta äänitys">
      <div class="icon"></div>
    </button>
    <div class="timer" id="timer">00:00</div>
    <div class="status-text" id="statusText" data-i18n="statusPressToStart">Paina aloittaaksesi äänityksen</div>

  </div>

  <!-- Player bar -->
  <div class="player-bar" id="playerBar">
    <span class="now-playing" id="nowPlaying"></span>
    <audio id="audioPlayer" controls></audio>
    <button class="player-close" id="playerClose" data-i18n-title="closePlayer" title="Sulje soitin">✕</button>
  </div>

  <!-- Recordings -->
  <div class="recordings-header">
    <h2 data-i18n="recordingsHeading">Tallenteet</h2>
    <span class="recording-count" id="recordingCount"></span>
  </div>

  <div class="bulk-bar" id="bulkBar">
    <span class="bulk-bar-count" id="bulkCount"></span>
    <button class="bulk-btn" id="bulkDownloadBtn">&#11015; Download selected</button>
    <button class="bulk-btn danger" id="bulkDeleteBtn">&#128465;&#65039; Delete selected</button>
    <button class="bulk-btn secondary" id="bulkClearBtn">Clear</button>
  </div>

  <ul class="recordings-list" id="recordingsList"></ul>
  <div class="empty-state" id="emptyState" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
    <p data-i18n="emptyState">Ei vielä tallenteita</p>
  </div>
</div>

<!-- Rename modal -->
<div class="modal-overlay" id="renameModal">
  <div class="modal">
    <h3 data-i18n="renameTitle">Nimeä uudelleen</h3>
    <input type="text" id="renameInput" data-i18n-placeholder="renamePlaceholder" placeholder="Uusi nimi">
    <div class="modal-buttons">
      <button class="btn-cancel" id="renameCancel" data-i18n="cancel">Peruuta</button>
      <button class="btn-save" id="renameSave" data-i18n="save">Tallenna</button>
    </div>
  </div>
</div>

<script>
  const API = '';
  const recordBtn = document.getElementById('recordBtn');
  const timer = document.getElementById('timer');
  const statusText = document.getElementById('statusText');
  const recordingsList = document.getElementById('recordingsList');
  const recordingCount = document.getElementById('recordingCount');
  const emptyState = document.getElementById('emptyState');
  const playerBar = document.getElementById('playerBar');
  const audioPlayer = document.getElementById('audioPlayer');
  const nowPlaying = document.getElementById('nowPlaying');
  const playerClose = document.getElementById('playerClose');
  const renameModal = document.getElementById('renameModal');
  const renameInput = document.getElementById('renameInput');
  const renameSave = document.getElementById('renameSave');
  const renameCancel = document.getElementById('renameCancel');
  const bulkBar = document.getElementById('bulkBar');
  const bulkCount = document.getElementById('bulkCount');
  const bulkDownloadBtn = document.getElementById('bulkDownloadBtn');
  const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
  const bulkClearBtn = document.getElementById('bulkClearBtn');
  const themeToggle = document.getElementById('themeToggle');
  const autoPlayToggle = document.getElementById('autoPlayToggle');
  let isRecording = false;
  let timerInterval = null;
  let startTime = 0;
  let renameTarget = null;

  const messages = {
    fi: {
      appName: 'Raspi recorder',
      recordButtonTitle: 'Aloita/lopeta äänitys',
      statusPressToStart: 'Paina aloittaaksesi äänityksen',
      statusSaving: 'Tallennetaan...',
      statusSaved: 'Tallennettu: {filename}',
      statusRecording: 'Äänitetään...',
      statusError: 'Virhe',
      connectionError: 'Yhteysvirhe',
      closePlayer: 'Sulje soitin',
      recordingsHeading: 'Tallenteet',
      emptyState: 'Ei vielä tallenteita',
      renameTitle: 'Nimeä uudelleen',
      renamePlaceholder: 'Uusi nimi',
      cancel: 'Peruuta',
      save: 'Tallenna',
      listenTitle: 'Kuuntele',
      downloadTitle: 'Lataa',
      renameActionTitle: 'Nimeä uudelleen',
      deleteTitle: 'Poista',
      countSingular: 'tallenne',
      countPlural: 'tallennetta',
      deleteConfirm: 'Poistetaanko "{filename}"?',
      deleteFailed: 'Poistaminen epäonnistui',
      bulkDeleteConfirm: 'Poistetaanko {count} tallenne(tta)? Tätä ei voi peruuttaa.',
      bulkDeleteFailed: 'Poistaminen epäonnistui',
      renameFailed: 'Nimeäminen epäonnistui',
      loadingFailed: 'Tallenteiden haku epäonnistui'
    },
    en: {
      appName: 'Raspi recorder',
      recordButtonTitle: 'Start/stop recording',
      statusPressToStart: 'Press to start recording',
      statusSaving: 'Saving...',
      statusSaved: 'Saved: {filename}',
      statusRecording: 'Recording...',
      statusError: 'Error',
      connectionError: 'Connection error',
      closePlayer: 'Close player',
      recordingsHeading: 'Recordings',
      emptyState: 'No recordings yet',
      renameTitle: 'Rename recording',
      renamePlaceholder: 'New name',
      cancel: 'Cancel',
      save: 'Save',
      listenTitle: 'Listen',
      downloadTitle: 'Download',
      renameActionTitle: 'Rename',
      deleteTitle: 'Delete',
      bulkDeleteConfirm: 'Delete {count} recording(s)? This cannot be undone.',
      bulkDeleteFailed: 'Delete failed',
      countSingular: 'recording',
      countPlural: 'recordings',
      deleteConfirm: 'Delete "{filename}"?',
      deleteFailed: 'Delete failed',
      renameFailed: 'Rename failed',
      loadingFailed: 'Failed to load recordings'
    }
  };

  function detectLocale() {
    const browserLang = (navigator.language || navigator.userLanguage || 'fi').toLowerCase();
    if (browserLang.startsWith('fi')) return 'fi';
    return 'en';
  }

  const locale = detectLocale();
  const i18n = messages[locale];

  // ── Theme ────────────────────────────────────
  function applyTheme(light) {
    document.body.classList.toggle('light', light);
    document.getElementById('themeLabel').textContent = light ? 'Dark mode' : 'Light mode';
    themeToggle.checked = light;
  }

  const savedTheme = localStorage.getItem('theme');
  applyTheme(savedTheme === 'light');

  themeToggle.addEventListener('change', () => {
    const light = themeToggle.checked;
    applyTheme(light);
    localStorage.setItem('theme', light ? 'light' : 'dark');
  });

  // ── Auto-play preference ─────────────────────
  autoPlayToggle.checked = localStorage.getItem('autoPlay') === 'true';

  autoPlayToggle.addEventListener('change', () => {
    localStorage.setItem('autoPlay', autoPlayToggle.checked);
  });

  function t(key, vars = {}) {
    const template = i18n[key] || messages.fi[key] || key;
    return template.replace(/\{(\w+)\}/g, (_, token) => vars[token] ?? '');
  }

  function applyTranslations() {
    document.documentElement.lang = locale;

    document.querySelectorAll('[data-i18n]').forEach((el) => {
      el.textContent = t(el.dataset.i18n);
    });

    document.querySelectorAll('[data-i18n-title]').forEach((el) => {
      el.title = t(el.dataset.i18nTitle);
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    });
  }

  // ── Timer ───────────────────────────────────
  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function startTimer() {
    startTime = Date.now();
    timer.classList.add('active');
    timerInterval = setInterval(() => {
      timer.textContent = formatTime((Date.now() - startTime) / 1000);
    }, 250);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timer.classList.remove('active');
    timer.textContent = '00:00';
  }

  // ── Recording controls ──────────────────────
  recordBtn.addEventListener('click', async () => {
    if (isRecording) {
      recordBtn.disabled = true;
      statusText.textContent = t('statusSaving');
      try {
        const res = await fetch(`${API}/api/record/stop`, { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          statusText.textContent = t('statusSaved', { filename: data.filename });
          loadRecordings();
          if (autoPlayToggle.checked) playRecording(data.filename);
        } else {
          statusText.textContent = data.error || t('statusError');
        }
      } catch (e) {
        statusText.textContent = t('connectionError');
      }
      isRecording = false;
      recordBtn.classList.remove('recording');
      recordBtn.disabled = false;
      stopTimer();
    } else {
      try {
        const res = await fetch(`${API}/api/record/start`, { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          isRecording = true;
          recordBtn.classList.add('recording');
          statusText.textContent = t('statusRecording');
          startTimer();
        } else {
          statusText.textContent = data.error || t('statusError');
        }
      } catch (e) {
        statusText.textContent = t('connectionError');
      }
    }
  });




  // ── Recordings list ─────────────────────────
  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function formatDate(ts) {
    return new Date(ts * 1000).toLocaleString(locale);
  }

  async function loadRecordings() {
    try {
      const res = await fetch(`${API}/api/recordings`);
      const recordings = await res.json();

      const unit = recordings.length === 1 ? t('countSingular') : t('countPlural');
      recordingCount.textContent = `${recordings.length} ${unit}`;

      if (recordings.length === 0) {
        recordingsList.innerHTML = '';
        emptyState.style.display = '';
        return;
      }

      emptyState.style.display = 'none';
      recordingsList.innerHTML = recordings.map(r => `
        <li class="recording-item" data-filename="${esc(r.filename)}">
          <input type="checkbox" class="rec-check" onchange="toggleSelect('${esc(r.filename)}', this.checked)">
          <div class="recording-info">
            <div class="recording-name">${esc(r.filename)}</div>
            <div class="recording-meta">${formatDate(r.created)} · ${formatSize(r.size)}</div>
          </div>
          <div class="recording-actions">
            <button class="btn-icon" onclick="playRecording('${esc(r.filename)}')" title="${t('listenTitle')}">▶</button>
            <button class="btn-icon" onclick="downloadRecording('${esc(r.filename)}')" title="${t('downloadTitle')}">⬇</button>
            <button class="btn-icon" onclick="openRename('${esc(r.filename)}')" title="${t('renameActionTitle')}">✏️</button>
            <button class="btn-icon danger" onclick="deleteRecording('${esc(r.filename)}')" title="${t('deleteTitle')}">🗑️</button>
          </div>
        </li>
      `).join('');
      // Restore checkbox state after re-render
      selectedFiles.forEach(name => {
        const li = recordingsList.querySelector(`[data-filename="${CSS.escape(name)}"]`);
        if (li) {
          li.querySelector('.rec-check').checked = true;
          li.classList.add('selected');
        }
      });
      updateBulkBar();
    } catch (e) {
      console.error(t('loadingFailed'), e);
    }
  }

  // ── Multi-select & bulk download ────────────
  const selectedFiles = new Set();

  function toggleSelect(filename, checked) {
    const li = recordingsList.querySelector(`[data-filename="${CSS.escape(filename)}"]`);
    if (checked) {
      selectedFiles.add(filename);
      if (li) li.classList.add('selected');
    } else {
      selectedFiles.delete(filename);
      if (li) li.classList.remove('selected');
    }
    updateBulkBar();
  }

  function updateBulkBar() {
    const n = selectedFiles.size;
    if (n > 0) {
      bulkBar.classList.add('visible');
      bulkCount.textContent = `${n} selected`;
    } else {
      bulkBar.classList.remove('visible');
    }
  }

  bulkClearBtn.addEventListener('click', () => {
    selectedFiles.clear();
    recordingsList.querySelectorAll('.rec-check').forEach(cb => { cb.checked = false; });
    recordingsList.querySelectorAll('.recording-item').forEach(li => li.classList.remove('selected'));
    updateBulkBar();
  });

  bulkDownloadBtn.addEventListener('click', async () => {
    if (selectedFiles.size === 0) return;
    bulkDownloadBtn.disabled = true;
    try {
      const res = await fetch(`${API}/api/recordings/download-zip`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filenames: [...selectedFiles] }),
      });
      if (res.ok) {
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'recordings.zip';
        a.click();
        URL.revokeObjectURL(url);
      }
    } catch (e) {
      alert(t('connectionError'));
    }
    bulkDownloadBtn.disabled = false;
  });

  bulkDeleteBtn.addEventListener('click', async () => {
    if (selectedFiles.size === 0) return;
    const count = selectedFiles.size;
    if (!confirm(t('bulkDeleteConfirm', { count }))) return;
    bulkDeleteBtn.disabled = true;
    try {
      const res = await fetch(`${API}/api/recordings/delete-many`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filenames: [...selectedFiles] }),
      });
      if (res.ok) {
        const data = await res.json();
        // Close player if any deleted file was playing
        if (data.deleted && data.deleted.includes(nowPlaying.textContent)) {
          playerClose.click();
        }
        selectedFiles.clear();
        updateBulkBar();
        loadRecordings();
      } else {
        alert(t('bulkDeleteFailed'));
      }
    } catch (e) {
      alert(t('connectionError'));
    }
    bulkDeleteBtn.disabled = false;
  });

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ── Playback ────────────────────────────────
  function playRecording(filename) {
    audioPlayer.src = `${API}/api/recordings/${encodeURIComponent(filename)}`;
    nowPlaying.textContent = filename;
    playerBar.classList.add('visible');
    audioPlayer.play();
  }

  playerClose.addEventListener('click', () => {
    audioPlayer.pause();
    audioPlayer.src = '';
    playerBar.classList.remove('visible');
  });

  // ── Download ────────────────────────────────
  function downloadRecording(filename) {
    const a = document.createElement('a');
    a.href = `${API}/api/recordings/${encodeURIComponent(filename)}`;
    a.download = filename;
    a.click();
  }

  // ── Delete ──────────────────────────────────
  async function deleteRecording(filename) {
    if (!confirm(t('deleteConfirm', { filename }))) return;
    try {
      await fetch(`${API}/api/recordings/${encodeURIComponent(filename)}`, { method: 'DELETE' });
      loadRecordings();
      // close player if playing this file
      if (nowPlaying.textContent === filename) {
        playerClose.click();
      }
    } catch (e) {
      alert(t('deleteFailed'));
    }
  }

  // ── Rename ──────────────────────────────────
  function openRename(filename) {
    renameTarget = filename;
    renameInput.value = filename.replace(/\.wav$/i, '');
    renameModal.classList.add('visible');
    setTimeout(() => renameInput.focus(), 100);
  }

  renameCancel.addEventListener('click', () => {
    renameModal.classList.remove('visible');
  });

  renameModal.addEventListener('click', (e) => {
    if (e.target === renameModal) renameModal.classList.remove('visible');
  });

  renameSave.addEventListener('click', async () => {
    const newName = renameInput.value.trim();
    if (!newName || !renameTarget) return;
    try {
      const res = await fetch(`${API}/api/recordings/${encodeURIComponent(renameTarget)}/rename`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: newName }),
      });
      const data = await res.json();
      if (res.ok) {
        renameModal.classList.remove('visible');
        loadRecordings();
      } else {
        alert(data.error || t('renameFailed'));
      }
    } catch (e) {
      alert(t('connectionError'));
    }
  });

  renameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') renameSave.click();
    if (e.key === 'Escape') renameCancel.click();
  });

  // ── Init ────────────────────────────────────
  applyTranslations();
  loadRecordings();

  // Poll server state — syncs UI when hardware buttons start/stop recording
  async function pollStatus() {
    try {
      const res = await fetch(`${API}/api/status`);
      const data = await res.json();
      if (data.is_recording && !isRecording) {
        // Recording started via hardware button
        isRecording = true;
        recordBtn.classList.add('recording');
        statusText.textContent = t('statusRecording');
        startTime = Date.now() - data.elapsed * 1000;
        timer.classList.add('active');
        timerInterval = setInterval(() => {
          timer.textContent = formatTime((Date.now() - startTime) / 1000);
        }, 250);
      } else if (!data.is_recording && isRecording) {
        // Recording stopped via hardware button — reload list to show new file
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtn.disabled = false;
        stopTimer();
        statusText.textContent = t('statusPressToStart');
        loadRecordings();
      }
    } catch (e) {}
  }

  pollStatus();
  setInterval(pollStatus, 2000);
</script>

</body>
</html>
